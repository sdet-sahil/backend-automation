name: Jira Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jira-tests:
    name: Jira integration tests
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-17
    concurrency:
      group: jira-tests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      JIRA_ISSUE_TYPE: ${{ vars.JIRA_ISSUE_TYPE }}
      JIRA_REQUIRED_FIELDS_JSON: ${{ secrets.JIRA_REQUIRED_FIELDS_JSON }}
      JIRA_CHILD_DONE_TIMEOUT_MS: ${{ vars.JIRA_CHILD_DONE_TIMEOUT_MS }}
      JIRA_CHILD_DONE_POLL_INTERVAL_MS: ${{ vars.JIRA_CHILD_DONE_POLL_INTERVAL_MS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: maven-${{ runner.os }}-java17-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-java17-

      - name: Validate Jira configuration
        shell: bash
        run: |
          missing=()
          [[ -n "$JIRA_BASE_URL" ]] || missing+=(JIRA_BASE_URL)
          [[ -n "$JIRA_EMAIL" ]] || missing+=(JIRA_EMAIL)
          [[ -n "$JIRA_API_TOKEN" ]] || missing+=(JIRA_API_TOKEN)
          [[ -n "$JIRA_PROJECT_KEY" ]] || missing+=(JIRA_PROJECT_KEY)
          [[ -n "$JIRA_ISSUE_TYPE" ]] || missing+=(JIRA_ISSUE_TYPE)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions variables/secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Run Jira test suite
        run: mvn -B test

      - name: Upload Jira test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-test-reports
          path: target/surefire-reports/**
          if-no-files-found: warn
